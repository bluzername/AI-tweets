name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-test.txt
      - name: Syntax check everything
        run: python -m compileall -q src main.py viral_main.py daemon.py hebrew_orchestrator.py scripts
      - run: pytest -q
